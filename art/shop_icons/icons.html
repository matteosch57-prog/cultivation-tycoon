<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<!-- Store icons for every pass / product (512 x 512): docs/design/SHOP_ITEMS.md. ?key=<item key> -->
<style>html,body{margin:0;width:512px;height:512px;overflow:hidden;background:transparent}
.t{position:absolute;left:28px;top:28px;width:456px;height:456px;border-radius:96px;border:14px solid #1b1420;box-sizing:border-box;box-shadow:0 16px 0 #1b1420;display:flex;align-items:center;justify-content:center}
.t::before{content:"";position:absolute;left:12%;right:12%;top:9%;height:16%;border-radius:999px;background:rgba(255,255,255,.4);z-index:0}
.t svg{position:relative;z-index:1}
</style></head><body><div class="t" id="t"></div><script>
const INK='#1b1420';
const qi=(s,f='#6fd6ae')=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M32 4C44 16 54 26 54 38a22 22 0 0 1-44 0C10 26 20 16 32 4z" fill="${f}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M32 22c7 6 11 11 11 17a11 11 0 0 1-15 10c6-2 8-8 4-13-3-4-2-9 0-14z" fill="#e8fff4"/><circle cx="22" cy="34" r="4" fill="#fff" opacity=".8"/></svg>`;
const robux=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M32 4l24 14v28L32 60 8 46V18z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M32 18l12 7v14l-12 7-12-7V25z" fill="${INK}"/></svg>`;
const ic={
 x2:s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><g transform="translate(-6 4) scale(.85)">${qi(64).replace(/<\/?svg[^>]*>/g,'')}</g><text x="44" y="56" font-family="Fredoka" font-weight="700" font-size="26" fill="#ffe36b" stroke="${INK}" stroke-width="6" paint-order="stroke" text-anchor="middle">2x</text></svg>`,
 vip:s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M8 50L5 18l15 13 12-20 12 20 15-13-3 32z" fill="#ffd34d" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><rect x="8" y="46" width="48" height="10" rx="3" fill="#ffb02e" stroke="${INK}" stroke-width="5"/><circle cx="32" cy="35" r="5" fill="#59d39f" stroke="${INK}" stroke-width="3"/><circle cx="17" cy="28" r="3" fill="#fff" opacity=".7"/></svg>`,vipOld:s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><rect x="8" y="14" width="48" height="8" rx="3" fill="#e65b4f" stroke="${INK}" stroke-width="4"/><rect x="14" y="20" width="7" height="36" rx="2" fill="#e65b4f" stroke="${INK}" stroke-width="4"/><rect x="43" y="20" width="7" height="36" rx="2" fill="#e65b4f" stroke="${INK}" stroke-width="4"/><rect x="18" y="26" width="28" height="15" rx="3" fill="#ffd34d" stroke="${INK}" stroke-width="4"/><path d="M4 14q28-12 56 0" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="M4 14q28-12 56 0" fill="none" stroke="#3a2d40" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="33" r="2.4" fill="${INK}"/><circle cx="32" cy="33" r="2.4" fill="${INK}"/><circle cx="38" cy="33" r="2.4" fill="${INK}"/></svg>`,
 auto:s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="10" cy="16" r="5" fill="#9ff5d0" stroke="${INK}" stroke-width="3.5"/><circle cx="14" cy="48" r="6" fill="#9ff5d0" stroke="${INK}" stroke-width="3.5"/><circle cx="21" cy="31" r="7" fill="#9ff5d0" stroke="${INK}" stroke-width="4"/><circle cx="43" cy="32" r="17" fill="#9ff5d0" stroke="${INK}" stroke-width="5"/><circle cx="37" cy="26" r="6" fill="#fff" opacity=".85"/></svg>`,
 pill:s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><g transform="rotate(-35 32 32)"><rect x="12" y="22" width="22" height="20" rx="10" fill="#e65b4f" stroke="${INK}" stroke-width="5"/><rect x="30" y="22" width="22" height="20" rx="10" fill="#fff4dc" stroke="${INK}" stroke-width="5"/><rect x="26" y="22" width="12" height="20" fill="#e65b4f"/><rect x="32" y="24.5" width="6" height="15" fill="#fff4dc"/></g><path d="M50 4l-8 13h7l-6 12" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M50 4l-8 13h7l-6 12" fill="none" stroke="#ffe36b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
 pack:(s,n)=>{let g='';const pos=[[32,40,1],[18,44,.8],[46,44,.8],[25,26,.7],[40,24,.7],[32,14,.6]];for(let i=n-1;i>=0;i--){const[x,y,sc]=pos[i];g+=`<g transform="translate(${x-32*sc*.62} ${y-32*sc*.62}) scale(${sc*.62})">${qi(64).replace(/<\/?svg[^>]*>/g,'')}</g>`}return `<svg width="${s}" height="${s}" viewBox="0 0 64 64">${g}</svg>`},
 bag:s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M22 14h20l-4 8h-12z" fill="#e65b4f" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/><path d="M26 22h12c12 6 18 16 18 24 0 9-8 14-24 14S8 55 8 46c0-8 6-18 18-24z" fill="#ffd34d" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><rect x="22" y="20" width="20" height="5" rx="2" fill="#e65b4f" stroke="${INK}" stroke-width="3.5"/><g transform="translate(20 30) scale(.38)">${qi(64).replace(/<\/?svg[^>]*>/g,'')}</g><circle cx="17" cy="38" r="3" fill="#fff" opacity=".7"/></svg>`,
};
const discOld=(s,robe)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="32" cy="12" r="7" fill="${INK}"/><circle cx="32" cy="29" r="13" fill="#f2cfae" stroke="${INK}" stroke-width="4"/><path d="M19 26c2-9 24-9 26 0-6-4-20-4-26 0z" fill="${INK}"/><path d="M12 62c2-14 10-20 20-20s18 6 20 20z" fill="${robe}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M32 42l-5 20h10z" fill="#fff"/></svg>`;
// a disciple; higher tiers get a halo and more rays behind them (tier 0 = Elder)
const disc=(s,robe,tier)=>{let rays='';const n=[0,0,6,8,10,12][tier];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;rays+=`<path d="M32 30 L${32+Math.cos(a-0.12)*34} ${30+Math.sin(a-0.12)*34} L${32+Math.cos(a+0.12)*34} ${30+Math.sin(a+0.12)*34}z" fill="${robe}" opacity=".45"/>`}
const halo=tier>=1?`<circle cx="32" cy="27" r="19" fill="none" stroke="${INK}" stroke-width="6"/><circle cx="32" cy="27" r="19" fill="none" stroke="#ffe36b" stroke-width="3"/>`:'';
return `<svg width="${s}" height="${s}" viewBox="-4 -4 72 72" style="overflow:visible">${rays}${halo}<circle cx="32" cy="12" r="7" fill="${INK}"/><circle cx="32" cy="29" r="13" fill="#f2cfae" stroke="${INK}" stroke-width="4"/><path d="M19 26c2-9 24-9 26 0-6-4-20-4-26 0z" fill="${INK}"/><path d="M12 62c2-14 10-20 20-20s18 6 20 20z" fill="${robe}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M32 42l-5 20h10z" fill="#fff"/></svg>`};
const pill=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><defs><clipPath id="L"><rect x="0" y="0" width="32" height="64"/></clipPath></defs><g transform="rotate(-35 32 34)"><rect x="9" y="23" width="46" height="22" rx="11" fill="#fff4dc" stroke="${INK}" stroke-width="5"/><rect x="9" y="23" width="46" height="22" rx="11" fill="#e65b4f" clip-path="url(#L)"/><rect x="9" y="23" width="46" height="22" rx="11" fill="none" stroke="${INK}" stroke-width="5"/><line x1="32" y1="23" x2="32" y2="45" stroke="${INK}" stroke-width="4"/><circle cx="17" cy="29" r="3" fill="#fff" opacity=".7"/></g><path d="M52 2l-8 13h7l-6 12" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M52 2l-8 13h7l-6 12" fill="none" stroke="#ffe36b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
const K={x2:['#9ff5c8',s=>ic.x2(s)],auto:['#9fd0ff',s=>ic.auto(s)],vip:['#ffd36b',s=>ic.vip(s)],pill:['#ffb3a8',s=>pill(s)],
pack1:['#c9ffe4',s=>ic.pack(s,1)],pack2:['#b9f0d6',s=>ic.pack(s,3)],pack3:['#a6e8c8',s=>ic.pack(s,6)],
elder:['#e5c1ff',s=>disc(s,'#be64ff',0)],immortal:['#ffecb1',s=>disc(s,'#ffc83c',1)],celestial:['#c4f3f7',s=>disc(s,'#6ee1eb',2)],
dao:['#f5a8ad',s=>disc(s,'#e6323c',3)],emperor:['#ffcd9e',s=>disc(s,'#ff8c28',4)],primordial:['#ffc2ef',s=>disc(s,'#ff6edc',5)],
welcome:['#ffd36b',s=>`<div style="position:relative;width:${s}px;height:${s}px">${ic.bag(s)}<div style="position:absolute;right:-${s*0.06}px;bottom:${s*0.04}px">${disc(s*0.58,'#be64ff',0)}</div></div>`]};
const key=new URLSearchParams(location.search).get('key');const [bg,f]=K[key];
const t=document.getElementById('t');t.style.background=bg;t.innerHTML=f(330);
</script></body></html>
