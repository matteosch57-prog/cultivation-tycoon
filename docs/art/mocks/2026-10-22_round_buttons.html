<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Round Buttons</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<!-- Round toy buttons (owner 2026-10-22: the glass cap of the square buttons "looks weird" on circles).
     Now = today's cap; A glint, B dome, C jade ring. Shown 2x (big) and at phone size (small).
     Render: python tools/mock_round_buttons.py -->
<style>
:root{--ink:#1B1420;--muted:#CBBFD6;--f:"Fredoka",system-ui,sans-serif}
html,body{margin:0;background:linear-gradient(180deg,#6FA8D8,#9CC7E6 60%,#CFE3EF);font-family:var(--f);color:#fff}
.board{width:1300px;padding:18px 22px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:190px 1fr 250px;align-items:center;background:rgba(27,20,32,.28);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;box-shadow:0 4px 0 var(--ink)}
.name{font-size:30px;font-weight:700;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.what{font-size:15px;font-weight:500;color:#fff;-webkit-text-stroke:.6px var(--ink);paint-order:stroke fill;margin-top:2px;line-height:1.2}
.btns{display:flex;gap:18px;align-items:center}
.small{display:flex;gap:9px;align-items:center;justify-content:flex-end}
.b{position:relative;flex:none}
.sh{position:absolute;inset:0;transform:translateY(var(--d));background:var(--ink);border-radius:var(--r)}
.face{position:absolute;inset:0;border-radius:var(--r);background:var(--c);box-shadow:inset 0 0 0 var(--st) var(--ink);overflow:hidden}
.icon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background-image:url(../../../art/ui/icon_atlas.png);background-repeat:no-repeat;z-index:3}
/* Now: the square buttons' glass cap */
.glass{position:absolute;left:5%;top:5%;width:90%;height:46%;border-radius:calc(var(--r) - 3px);background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.22) 60%,rgba(255,255,255,.03));z-index:2}
/* A glint: one white tilted oval, top left (the red dot's glint, the recruit orb's highlight) */
.glint{position:absolute;left:17%;top:12%;width:34%;height:19%;border-radius:50%;background:rgba(255,255,255,.88);transform:rotate(-38deg);z-index:2}
.glint2{position:absolute;left:47%;top:9%;width:8%;height:8%;border-radius:50%;background:rgba(255,255,255,.7);z-index:2}
/* B dome: lit from above like a ball (the Recruit seal's soft light) */
.dome{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%,rgba(0,0,0,.24));z-index:1}
.lift{position:absolute;left:12%;top:2%;width:76%;height:58%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.42),rgba(255,255,255,0));z-index:1}
/* C jade ring: a thin light ring inside the rim (a bi disc, a coin) + a soft top light */
.ring{position:absolute;inset:11%;border-radius:50%;box-shadow:0 0 0 var(--rw) rgba(255,255,255,.42);z-index:2}
.top{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);z-index:1}
.cap{font-size:14px;font-weight:700;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-align:center;margin-top:6px}
.col{display:flex;flex-direction:column;align-items:center}
.sep{width:3px;height:70px;background:rgba(27,20,32,.35);border-radius:2px;margin:0 4px}
</style></head><body><div class="board" id="board"></div>
<script>
const CELL={shop:3,hall:8,trophy:30,gift:6,pill:5,altar:20,palm:18};
const BTNS=[["shop","#FFD36B","Shop",42,0],["hall","#6FE0B4","Base",40,1],["trophy","#FFD36B","Ranks",40,1],
  ["gift","#3A2C44","Gift",40,1],["pill","#3A2C44","Pill",40,1],["altar","#D9473B","Altar",46,1],["palm","#FF9F43","Palm",64,1]];
const OPTS=[["Now","the square buttons' glass cap, on a circle"],
  ["A Glint","no cap: one white oval glint, top left, like the red dot and the recruit orb"],
  ["B Dome","no cap: lit from above like a ball, the Recruit seal's soft light"],
  ["C Jade ring","no cap: a thin light ring inside the rim (a jade bi disc), soft top light"]];
function btn(key,color,size,round,opt,k){
  const s=size*k, r=round?s/2:Math.round(size*.26*k), st=3*k*0.75, d=4*k*0.75;
  const b=document.createElement("div");b.className="b";b.style.cssText=`width:${s}px;height:${s}px;--r:${r}px;--c:${color};--st:${st}px;--d:${d}px;--rw:${Math.max(1.5,2*k*.6)}px`;
  let inner="";
  if(!round||opt==="Now") inner=`<div class="glass"></div>`;
  else if(opt.startsWith("A")) inner=`<div class="glint"></div><div class="glint2"></div>`;
  else if(opt.startsWith("B")) inner=`<div class="dome"></div><div class="lift"></div>`;
  else inner=`<div class="top"></div><div class="ring"></div>`;
  const is=Math.round(s*(key==="palm"?.62:key==="altar"?.74:.72)), i=CELL[key];
  b.innerHTML=`<div class="sh"></div><div class="face">${inner}</div><div class="icon" style="width:${is}px;height:${is}px;background-size:${is*8}px ${is*8}px;background-position:-${(i%8)*is}px -${Math.floor(i/8)*is}px"></div>`;
  return b;
}
const board=document.getElementById("board");
for(const [opt,what] of OPTS){
  const row=document.createElement("div");row.className="row";
  row.innerHTML=`<div><div class="name">${opt}</div><div class="what">${what}</div></div>`;
  const big=document.createElement("div");big.className="btns";
  BTNS.forEach(([key,c,cap,size,round],n)=>{
    const col=document.createElement("div");col.className="col";
    col.appendChild(btn(key,c,size,round,opt,1.7));
    const t=document.createElement("div");t.className="cap";t.textContent=cap;col.appendChild(t);
    big.appendChild(col);
    if(n===0){const sp=document.createElement("div");sp.className="sep";big.appendChild(sp)}
  });
  const small=document.createElement("div");small.className="small";
  BTNS.forEach(([key,c,cap,size,round])=>small.appendChild(btn(key,c,size,round,opt,0.8)));
  row.appendChild(big);row.appendChild(small);board.appendChild(row);
}
</script></body></html>
