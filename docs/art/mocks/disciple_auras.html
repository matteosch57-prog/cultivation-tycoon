<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<!-- Moving auras for the disciple icons (2026-10-21, owner: "A but research about auras and make a
     big work on that. Something moving and pretty"). ?t=<seconds> draws one frame of a 3 s loop.
     Research: RNG games (Sol's RNG) make an aura's look climb with its rarity, from a plain coloured
     glow at the bottom to layered, moving effects at the top; gacha rarity ladders go glow, then
     particles, then an aura with trails, then a show; keep it readable (restraint at small sizes).
     Every layer here is a UI shape (circle, rotated bar, gradient), so it can be built in Roblox. -->
<style>
*{box-sizing:border-box;margin:0}
body{width:1000px;height:640px;font-family:Fredoka,sans-serif;background:url('../captures/26_check_full_peak.jpg') center/cover;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:rgba(20,16,30,.62)}
.grid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px 4px;padding:14px 18px}
.cell{display:flex;flex-direction:column;align-items:center}
.big{color:#fff;font-weight:700;-webkit-text-stroke:var(--sw,3px) #1b1420;paint-order:stroke fill;white-space:nowrap}
.name{font-size:16px;margin-top:-6px}
.what{font-size:11px;color:#e8e0f0;--sw:2.5px}
</style></head>
<body><div class="grid" id="g"></div>
<script>
const t=parseFloat(new URLSearchParams(location.search).get('t')||'0');
const TAU=Math.PI*2, INK='#1b1420', SKIN='#f2cfae';
const R=[
 ['Outer Disciple','#c8c8c8','a soft breathing glow'],
 ['Inner Disciple','#5ac878','glow + two motes circling'],
 ['Core Disciple','#5096ff','a turning ring with motes'],
 ['Elder','#be64ff','slow rays, motes rising'],
 ['Immortal','#ffc83c','a halo, rays, sparkles'],
 ['Celestial','#6ee1eb','clouds drifting round, light rising'],
 ['Dao Ancestor','#e6323c','a turning yin-yang, embers'],
 ['Heavenly Emperor','#ff8c28','twin rays, gold dust, crown glint'],
 ['Primordial','#ff6edc','every colour, flames, everything']];
const hsl=h=>`hsl(${(h%1)*360},90%,68%)`;
function figure(col,tier,hue){
  const robe=tier===8?hsl(hue):col;
  let b=`<ellipse cx="60" cy="83" rx="23" ry="7" fill="${robe}" stroke="${INK}" stroke-width="3.5"/>
   <path d="M43 82c0-14 7-20 17-20s17 6 17 20z" fill="${robe}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
   <path d="M60 62l-5 12h10z" fill="#fff"/><ellipse cx="60" cy="78" rx="7" ry="4" fill="${SKIN}" stroke="${INK}" stroke-width="2.5"/>`;
  if(tier>=2) b+=`<path d="M45 75c8 3 22 3 30 0" fill="none" stroke="${tier>=4?'#ffe36b':'#fff'}" stroke-width="3"/>`;
  let h=`<circle cx="60" cy="38" r="5.5" fill="${INK}"/><circle cx="60" cy="51" r="11" fill="${SKIN}" stroke="${INK}" stroke-width="3.5"/>
   <path d="M49 49c2-8 20-8 22 0-5-3-17-3-22 0z" fill="${INK}"/><path d="M55 53q2 2 4 0M61 53q2 2 4 0" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>`;
  if(tier===1) h+=`<rect x="64" y="34" width="9" height="3" rx="1.5" fill="#5ac878" stroke="${INK}" stroke-width="1.5"/>`;
  if(tier===3) h+=`<path d="M54 36l3-5 3 4 3-4 3 5z" fill="#d9b8ff" stroke="${INK}" stroke-width="1.8"/>`;
  if(tier===7) h+=`<path d="M50 37l3-7 4 5 3-6 3 6 4-5 3 7z" fill="#ffd34d" stroke="${INK}" stroke-width="2"/>`;
  return b+h;
}
// aura layers behind (and a few in front of) the figure; centre (60,58) in a 120 box
function aura(col,tier){
  const C=tier===8?hsl(t/3):col; let back='',front='';
  const breathe=0.5+0.5*Math.sin(t/3*TAU*2);
  const glowR=34+tier*1.6+breathe*3;
  // 1 glow: three soft discs (all tiers)
  for(const [k,a] of [[1.25,.10],[1,.16],[.75,.22]]) back+=`<circle cx="60" cy="60" r="${glowR*k}" fill="${C}" opacity="${(a+0.05*breathe)*(0.6+tier*0.08)}"/>`;
  // rays (Elder up): slow turning soft beams; twin counter rays for Emperor and Primordial
  const rays=(n,len,w,rot,op,colr)=>{let s='';for(let i=0;i<n;i++){s+=`<g transform="rotate(${rot+i*360/n} 60 60)"><path d="M${60-w/2} 60 L${60-w*0.15} ${60-len} L${60+w*0.15} ${60-len} L${60+w/2} 60z" fill="url(#rg${colr}${tier})" opacity="${op}"/></g>`}return s};
  if(tier>=3) back+=rays(tier>=4?12:8,58,14,t/3*360*0.35,0.55,'A');
  if(tier>=7) back+=rays(8,50,9,-t/3*360*0.6,0.6,'B');
  // ring (Core up): a dashed ring turning
  if(tier>=2&&tier!==6) back+=`<circle cx="60" cy="60" r="40" fill="none" stroke="${C}" stroke-width="2.5" stroke-dasharray="10 7" opacity=".85" transform="rotate(${t/3*360} 60 60)"/>`;
  // yin-yang ring (Dao Ancestor)
  if(tier===6){back+=`<g transform="rotate(${t/3*360*0.5} 60 60)" opacity=".85"><circle cx="60" cy="60" r="44" fill="none" stroke="${INK}" stroke-width="7"/><path d="M60 16a44 44 0 0 1 0 88" fill="none" stroke="#fff" stroke-width="7"/><circle cx="60" cy="16" r="6" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="60" cy="104" r="6" fill="${INK}" stroke="#fff" stroke-width="2"/></g>`;}
  // halo (Immortal, Emperor, Primordial)
  if(tier===4||tier>=7){const p=1+0.08*breathe;back+=`<ellipse cx="60" cy="29" rx="${16*p}" ry="${5*p}" fill="none" stroke="#fff6c0" stroke-width="5" opacity=".55"/><ellipse cx="60" cy="29" rx="${15*p}" ry="${4.5*p}" fill="none" stroke="#ffe36b" stroke-width="3"/>`;}
  // orbiting motes (Inner, Core)
  if(tier===1||tier===2){const n=tier===1?2:3;for(let i=0;i<n;i++){const a=t/3*TAU+i*TAU/n;front+=`<circle cx="${60+Math.cos(a)*40}" cy="${60+Math.sin(a)*40*0.45}" r="3.5" fill="#fff" opacity=".9"/><circle cx="${60+Math.cos(a)*40}" cy="${60+Math.sin(a)*40*0.45}" r="6" fill="${C}" opacity=".5"/>`;}}
  // rising motes / embers / dust (Elder, Celestial, Dao, Emperor, Primordial)
  if(tier===3||tier>=5){const n=tier>=7?8:5;for(let i=0;i<n;i++){const ph=((t/3)*(tier>=7?1.5:1)+i/n)%1;const x=60+Math.sin(i*2.3+ph*3)*30;const y=100-ph*85;const c=tier===6?'#ff7a3a':(tier===7?'#ffd34d':C);front+=`<circle cx="${x}" cy="${y}" r="${2.5+(i%2)}" fill="${c}" opacity="${Math.sin(ph*Math.PI)}"/>`;}}
  // twinkling sparkles (Immortal, Emperor, Primordial)
  if(tier===4||tier>=7){for(let i=0;i<5;i++){const a=i*1.37+0.3;const r=44;const tw=Math.max(0,Math.sin(t/3*TAU*2+i*1.9));const x=60+Math.cos(a)*r,y=58+Math.sin(a)*r*0.9;const s=6*tw;front+=`<path d="M${x} ${y-s}L${x+s*0.25} ${y-s*0.25}L${x+s} ${y}L${x+s*0.25} ${y+s*0.25}L${x} ${y+s}L${x-s*0.25} ${y+s*0.25}L${x-s} ${y}L${x-s*0.25} ${y-s*0.25}z" fill="#fff" opacity="${tw}"/>`;}}
  // clouds circling (Celestial)
  if(tier===5){for(let i=0;i<3;i++){const a=t/3*TAU*0.5+i*TAU/3;const x=60+Math.cos(a)*42,y=70+Math.sin(a)*14;const op=Math.sin(a)>0?.95:.55;(Math.sin(a)>0?front:null);const cl=`<g opacity="${op}"><circle cx="${x-6}" cy="${y}" r="6" fill="#f2ffff" stroke="${INK}" stroke-width="2"/><circle cx="${x+3}" cy="${y-3}" r="8" fill="#f2ffff" stroke="${INK}" stroke-width="2"/><circle cx="${x+10}" cy="${y+1}" r="5" fill="#f2ffff" stroke="${INK}" stroke-width="2"/><rect x="${x-8}" y="${y-1}" width="20" height="6" fill="#f2ffff"/></g>`;if(Math.sin(a)>0)front+=cl;else back+=cl;}}
  // flames (Primordial)
  if(tier===8){for(let i=0;i<7;i++){const a=-Math.PI/2+(i-3)*0.42;const fl=1+0.25*Math.sin(t/3*TAU*4+i*1.3);const x=60+Math.cos(a)*36,y=62+Math.sin(a)*40;const c=hsl(t/3+i/7);back+=`<path d="M${x-6} ${y+6} Q${x-7} ${y-6*fl} ${x} ${y-16*fl} Q${x+7} ${y-6*fl} ${x+6} ${y+6}z" fill="${c}" opacity=".8" transform="rotate(${(i-3)*24} ${x} ${y})"/>`;}}
  const defs=`<defs><linearGradient id="rgA${tier}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${C}" stop-opacity=".9"/><stop offset="1" stop-color="${C}" stop-opacity="0"/></linearGradient><linearGradient id="rgB${tier}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
  return [defs+back,front];
}
let h='';
R.forEach(([n,c,w],tier)=>{const [back,front]=aura(c,tier);const nc=tier===8?hsl(t/3):c;
 h+=`<div class="cell"><svg width="168" height="168" viewBox="0 0 120 120" overflow="visible">${back}${figure(c,tier,t/3)}${front}</svg><span class="big name" style="color:${nc}">${n}</span><span class="big what">${w}</span></div>`;});
// context: the disciples row as it would sit in the HUD (small size)
h+=`<div class="cell" style="justify-content:center"><span class="big what" style="font-size:13px;margin-bottom:6px">in the HUD row (small)</span><div style="display:flex;gap:2px;flex-wrap:wrap;width:170px">`;
R.forEach(([n,c],tier)=>{const [back,front]=aura(c,tier);h+=`<svg width="54" height="54" viewBox="0 0 120 120" overflow="visible">${back}${figure(c,tier,t/3)}${front}</svg>`;});
h+=`</div></div>`;
document.getElementById('g').innerHTML=h;
</script></body></html>
