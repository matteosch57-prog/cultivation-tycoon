<!doctype html>
<!-- Heavenly Altar review (owner 2026-10-23: "Make a higher more premium place, place the punch button
better, and make sure it pushes enough"). A three.js stand-in of the hub in the game's palette (Style.PAL),
studs = units. ?arena=A|B|C picks the altar: A Jade Lotus (round, petals), B Lei Tai (square duel stage,
corner banners), C Sky Pagoda (inverted pagoda tiers under an octagon). ?view=hero (from the plaza) or
?view=phone&btn=1|2 (on the altar, a 749 x 381 phone HUD: 1 = Palm takes the Recruit seal's spot left of
Jump while you stand on the altar, 2 = Palm on the thumb arc up-left of Jump). Rendered by
tools/mock_altar_arena.py (Edge headless, SwiftShader). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1B1420; }
  html, body { margin: 0; overflow: hidden; background: #000; font-family: Fredoka, sans-serif; }
  canvas { display: block; }
  .abs { position: absolute; }
  .big { color: #fff; font-weight: 700; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; line-height: 1.05; white-space: nowrap; }
  .tb { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .sq { position: absolute; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); background: #2B2433; }
  .lbl { position: absolute; left: 0; right: 0; bottom: 0; font: 600 13px "Segoe UI", sans-serif; color: #fff; background: rgba(0,0,0,.66); padding: 5px 12px; }
  .lbl.top { left: 50%; right: auto; bottom: auto; top: 44px; transform: translateX(-50%); width: 420px; font-size: 11px; border-radius: 6px; text-align: center; }
  .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); }
</style></head><body>
<div id="hud" class="abs" style="inset:0;pointer-events:none"></div>
<script src="icons.js"></script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
const q = new URLSearchParams(location.search);
const ARENA = q.get("arena") || "A", VIEW = q.get("view") || "hero", BTN = q.get("btn") || "1";
const W = +(q.get("w") || innerWidth), H = +(q.get("h") || innerHeight);
const C = { vermilion: 0xB8352B, tile: 0x3E4656, tileDark: 0x2B313D, gold: 0xD4A445, plaster: 0xEDE3CF, timber: 0x5A3A29,
  timberDark: 0x3A261C, jade: 0x6FB59C, jadePale: 0x8FD3B8, whiteJade: 0xE8F1EA, stone: 0x9C978C, stoneLight: 0xBDB7AB,
  grass: 0x6E9A55, grassDark: 0x557A43, dirt: 0x7A5B43, rock: 0x8A8078, bronze: 0x7A5A3A, pink: 0xF4B6C8, pinkDeep: 0xE58FAA };
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
// sky: a vertical gradient on a big sphere
{
  const g = new THREE.SphereGeometry(900, 32, 16);
  const cols = [], pos = g.attributes.position;
  const top = new THREE.Color(0x4F9BE0), mid = new THREE.Color(0x9CCDF2), low = new THREE.Color(0xEAF4FA);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 900, c = y > 0.1 ? mid.clone().lerp(top, Math.min(1, (y - 0.1) / 0.6)) : low.clone().lerp(mid, Math.max(0, (y + 0.3) / 0.4));
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
}
scene.add(new THREE.HemisphereLight(0xDDEEFF, 0x6E7A55, 1.25));
const sun = new THREE.DirectionalLight(0xFFF1D8, 2.4);
sun.position.set(60, 110, 70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 10, far: 300 });
sun.shadow.bias = -0.0006;
scene.add(sun);

const mats = {};
const M = (c, o = {}) => { const k = c + JSON.stringify(o); return mats[k] ||= new THREE.MeshStandardMaterial({ color: c, roughness: o.metal ? 0.45 : 0.85, metalness: o.metal ? 0.25 : 0, flatShading: !o.smooth, emissive: o.glow || o.metal ? c : 0, emissiveIntensity: o.glow || (o.metal ? 0.18 : 0), transparent: !!o.alpha, opacity: o.alpha || 1 }); };
function add(geo, color, x, y, z, o = {}) {
  const m = new THREE.Mesh(geo, M(color, o));
  m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx; if (o.ry) m.rotation.y = o.ry; if (o.rz) m.rotation.z = o.rz;
  m.castShadow = o.shadow !== false; m.receiveShadow = true;
  (o.parent || scene).add(m);
  return m;
}
const cyl = (r, h, s = 32, r2) => new THREE.CylinderGeometry(r, r2 ?? r, h, s);
const box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// ---------- the hub ----------
function island(x, z, r, y = 0, seed = 0) {
  add(cyl(r, 3, 28), C.grass, x, y - 1.5, z);
  add(cyl(r * 0.98, 2, 28, r * 0.9), C.dirt, x, y - 4, z, { shadow: false });
  for (let i = 0; i < 4; i++) add(cyl(r * (0.85 - i * 0.2), 6, 9, r * (0.65 - i * 0.2)), i % 2 ? C.rock : 0x7E746C, x, y - 8 - i * 6, z, { ry: i + seed, shadow: false });
}
island(0, 0, 44);
add(cyl(13, 0.5), C.stone, 0, 0.25, 0);
add(cyl(11, 0.6), C.stoneLight, 0, 0.3, 0);
add(cyl(4.5, 0.7), C.gold, 0, 0.35, 0);
// cauldron
add(cyl(1.9, 2.3, 16, 1.6), C.bronze, 0, 2.2, 0, { metal: 1 });
add(cyl(2.1, 0.3, 16), C.gold, 0, 3.35, 0, { metal: 1 });
for (let k = 0; k < 3; k++) { const a = k / 3 * Math.PI * 2; add(box(0.4, 1.4, 0.4), C.bronze, Math.cos(a) * 1.3, 0.9, Math.sin(a) * 1.3); }
add(new THREE.ConeGeometry(1.1, 2.2, 7), 0xFFB347, 0, 4.4, 0, { glow: 0.9, shadow: false });
// trees and lanterns round the rim, bridges out
function sakura(x, z, s = 1) {
  add(cyl(0.5 * s, 6 * s, 7), C.timber, x, 3 * s, z);
  for (let i = 0; i < 5; i++) add(new THREE.IcosahedronGeometry((2.4 + rnd() * 1.4) * s, 0), i % 2 ? C.pink : C.pinkDeep, x + (rnd() - .5) * 4 * s, (6.5 + rnd() * 2) * s, z + (rnd() - .5) * 4 * s, { ry: rnd() * 6 });
}
function pine(x, z, s = 1) {
  add(cyl(0.5 * s, 3 * s, 7), C.timber, x, 1.5 * s, z);
  for (let i = 0; i < 4; i++) add(new THREE.ConeGeometry((3.6 - i * 0.8) * s, 3 * s, 7), i % 2 ? 0x3E8A5A : 0x2F7A4C, x, (3.2 + i * 2) * s, z, { ry: i });
}
function lantern(x, z) {
  add(box(1.2, 0.4, 1.2), C.stoneLight, x, 0.2, z); add(cyl(0.25, 2.4, 6), C.stoneLight, x, 1.6, z);
  add(box(1, 0.9, 1), 0xFFE7A8, x, 3.1, z, { glow: 0.6 }); add(box(1.6, 0.35, 1.6), C.stoneLight, x, 3.75, z);
}
for (let i = 0; i < 6; i++) {
  const a = i / 6 * Math.PI * 2 + 0.3, mid = a + Math.PI / 6;
  if (i % 2) sakura(Math.cos(mid) * 31, Math.sin(mid) * 31); else pine(Math.cos(mid) * 31, Math.sin(mid) * 31, 1.2);
  lantern(Math.cos(a + 0.3) * 39, Math.sin(a + 0.3) * 39);
  const g = new THREE.Group(); g.position.set(Math.cos(a) * 44, -0.2, Math.sin(a) * 44); g.rotation.y = -a; scene.add(g);
  for (let k = 0; k < 18; k++) add(box(2.2, 0.35, 4.4), k % 2 ? C.timber : 0x664330, 1.2 + k * 2.3, -0.2 - Math.sin(k / 17 * Math.PI) * 2, 0, { parent: g });
}
// far peaks and clouds
for (const [x, z, r] of [[-170, -230, 60], [210, -200, 55], [-260, 60, 50], [250, 120, 48], [20, -300, 40]]) {
  island(x, z, r, -10, x);
  add(new THREE.ConeGeometry(14, 22, 6), 0x2F7A4C, x, 6, z);
  add(box(20, 8, 14), C.plaster, x + 18, 4, z + 10); add(new THREE.ConeGeometry(16, 7, 4), C.tile, x + 18, 11, z + 10, { ry: Math.PI / 4 });
}
for (let i = 0; i < 60; i++) {
  const a = rnd() * Math.PI * 2, r = 120 + rnd() * 380, y = -90 - rnd() * 60;
  add(new THREE.SphereGeometry(10 + rnd() * 14, 10, 7), 0xFFFFFF, Math.cos(a) * r, y, Math.sin(a) * r, { shadow: false }).scale.y = 0.45;
}

// ---------- the altar (height and radius per option) ----------
const AH = 28; // studs above the plaza (was 15)
const R = 11;  // play radius (was 9)
function brazier(x, y, z, lit) {
  for (let t = 0; t < 3; t++) add(box(0.25, 1.6, 0.25), C.bronze, x + Math.cos(t * 2.1) * 0.5, y + 0.8, z + Math.sin(t * 2.1) * 0.5, { metal: 1 });
  add(cyl(0.8, 0.5, 12, 0.55), C.bronze, x, y + 1.75, z, { metal: 1 });
  add(cyl(0.85, 0.18, 12), C.gold, x, y + 2.05, z, { metal: 1 });
  if (lit) add(new THREE.ConeGeometry(0.55, 1.4, 6), 0xFFB04A, x, y + 2.8, z, { glow: 1.2, shadow: false });
}
function floatingRock(y, r, depth) {
  for (let i = 0; i < 5; i++) {
    const rr = r * (1 - i * 0.18);
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * Math.PI * 2 + i * 0.4;
      add(new THREE.DodecahedronGeometry(rr * 0.42, 0), i % 2 ? C.rock : 0x7E746C, Math.cos(a) * rr * 0.45, y - rr * 0.42 - 1.2 - i * depth, Math.sin(a) * rr * 0.45, { ry: a, shadow: false });
    }
  }
}
// qi wisps under the altar (beams down to the springs read as "go up here")
function springs() {
  for (const sx of [-1, 1]) {
    add(cyl(2.3, 0.3, 24), C.gold, sx * 16, 0.5, -2, { metal: 1 });
    add(cyl(1.8, 0.34, 24), C.jade, sx * 16, 0.55, -2);
    add(cyl(1.6, 9, 16, 1.0), 0xC9FFE6, sx * 16, 5, -2, { glow: 0.6, alpha: 0.18, shadow: false });
  }
}
springs();

if (ARENA === "A") {
  // A: Jade Lotus — round jade field, a ring of open lotus petals hanging out and down from the rim
  floatingRock(AH, R, 2.2);
  add(cyl(R + 0.6, 1.4, 48), C.stone, 0, AH - 0.7, 0);
  add(cyl(R, 1.45, 48), C.stoneLight, 0, AH - 0.66, 0);
  add(cyl(R - 1.2, 1.5, 48), C.jade, 0, AH - 0.64, 0);
  add(cyl(R - 1.6, 1.52, 48), C.gold, 0, AH - 0.63, 0, { metal: 1 });
  add(cyl(R - 2.3, 1.54, 48), C.jade, 0, AH - 0.62, 0);
  add(cyl(2.6, 1.56, 32), C.gold, 0, AH - 0.61, 0, { metal: 1 });
  add(cyl(2.1, 1.58, 32), C.jadePale, 0, AH - 0.6, 0);
  for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2, mid = (2.6 + R - 2.3) / 2; add(box(0.4, 0.08, R - 5), C.gold, Math.cos(a) * mid, AH + 0.1, Math.sin(a) * mid, { ry: -a + Math.PI / 2, metal: 1 }); }
  // petals: two rings, outer pink, inner pale, tipped down and out (below the floor: never a wall)
  for (const [n, rr, sc, col, tilt, dy] of [[16, R + 1.2, 1, C.pink, 1.05, -1.4], [16, R + 0.4, 0.8, 0xFBE3EA, 0.7, -0.6]]) {
    for (let k = 0; k < n; k++) {
      const a = (k + (sc < 1 ? 0.5 : 0)) / n * Math.PI * 2;
      const g = new THREE.Group(); g.position.set(Math.cos(a) * rr, AH + dy, Math.sin(a) * rr); g.rotation.y = -a; scene.add(g);
      const p = add(new THREE.SphereGeometry(1, 10, 8), col, 0, 0, 0, { parent: g, smooth: 1 });
      p.scale.set(2.6 * sc, 0.35, 1.5 * sc); p.rotation.z = -tilt;
    }
  }
  for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; brazier(Math.cos(a) * (R - 0.5), AH, Math.sin(a) * (R - 0.5), k < 5); }
  // a slow gold rune ring under it
  add(new THREE.TorusGeometry(R * 0.8, 0.25, 8, 64), C.gold, 0, AH - 9, 0, { rx: Math.PI / 2, glow: 0.35, metal: 1, shadow: false });
  add(new THREE.TorusGeometry(R * 0.6, 0.15, 8, 64), 0xFFE9A8, 0, AH - 11, 0, { rx: Math.PI / 2, glow: 0.5, shadow: false });
} else if (ARENA === "B") {
  // B: Lei Tai — the classic square duel stage: lacquered apron, timber deck, taiji seal, corner posts
  // with banners (posts only at the corners: the edges stay open for ring-outs)
  const S = R * 2; // side
  floatingRock(AH - 3, R * 1.05, 2.4);
  add(box(S + 1.2, 3, S + 1.2), C.vermilion, 0, AH - 1.6, 0);
  add(box(S + 1.6, 0.5, S + 1.6), C.gold, 0, AH - 3.1, 0, { metal: 1 });
  add(box(S + 1.6, 0.4, S + 1.6), C.gold, 0, AH - 0.2, 0, { metal: 1 });
  for (let i = 0; i < 11; i++) add(box(S - 0.2, 0.3, S / 11 - 0.12), i % 2 ? 0x8A5A3A : 0x9A6644, 0, AH + 0.05, -S / 2 + (i + 0.5) * S / 11);
  add(cyl(4.2, 0.36, 48), C.gold, 0, AH + 0.12, 0, { metal: 1 });
  add(cyl(3.7, 0.4, 48), C.timberDark, 0, AH + 0.14, 0);
  add(new THREE.CylinderGeometry(3.7, 3.7, 0.42, 48, 1, false, 0, Math.PI), C.whiteJade, 0, AH + 0.15, 0);
  add(cyl(0.9, 0.44, 16), C.timberDark, 1.85, AH + 0.16, 0); add(cyl(0.9, 0.44, 16), C.whiteJade, -1.85, AH + 0.16, 0);
  // apron panels: gold cloud medallions
  for (const [x, z, ry] of [[0, S / 2 + 0.62, 0], [0, -S / 2 - 0.62, 0], [S / 2 + 0.62, 0, Math.PI / 2], [-S / 2 - 0.62, 0, Math.PI / 2]])
    for (const o of [-6, 0, 6]) add(cyl(0.9, 0.12, 16), C.gold, x + (ry ? 0 : o), AH - 1.6, z + (ry ? o : 0), { rx: Math.PI / 2, rz: ry, metal: 1 });
  for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const x = sx * (S / 2 - 0.2), z = sz * (S / 2 - 0.2);
    add(box(1.1, 9, 1.1), C.vermilion, x, AH + 4.5, z);
    add(box(1.6, 0.5, 1.6), C.gold, x, AH + 0.25, z, { metal: 1 });
    add(new THREE.ConeGeometry(1.1, 1.2, 4), C.gold, x, AH + 9.6, z, { ry: Math.PI / 4, metal: 1 });
    // banner hanging outward from a crossbar
    const g = new THREE.Group(); g.position.set(x, AH + 8.2, z); g.rotation.y = Math.atan2(sx, sz) ; scene.add(g);
    add(box(0.3, 0.3, 2.6), C.gold, 0, 0, 1.2, { parent: g, metal: 1 });
    add(box(0.15, 5.5, 1.9), C.plaster, 0, -2.9, 1.6, { parent: g });
    add(box(0.17, 4.6, 0.5), C.vermilion, 0, -2.9, 1.6, { parent: g });
    add(cyl(0.45, 0.9, 8), 0xFFD27A, 0, -6.3, 2.2, { parent: g, glow: 0.8 });
  }
  for (const [x, z] of [[S / 2 - 1.2, 0], [-S / 2 + 1.2, 0], [0, S / 2 - 1.2], [0, -S / 2 + 1.2]]) brazier(x, AH + 0.2, z, true);
} else {
  // C: Sky Pagoda — an inverted three-tier pagoda floating point-down, the arena on its widest
  // (top) floor: white jade, a gold rim with low gold lamps; dark tile eaves flare out under each tier
  const tiers = [[R, 3.2], [R * 0.72, 3], [R * 0.48, 2.8]];
  let y = AH;
  for (let i = 0; i < tiers.length; i++) {
    const [r, h] = tiers[i];
    add(cyl(r + 2.6, 0.9, 8, r + 0.6), C.tileDark, 0, y - 1.1, 0, { ry: Math.PI / 8 });
    add(cyl(r + 2.7, 0.3, 8), C.gold, 0, y - 0.6, 0, { ry: Math.PI / 8, metal: 1 });
    add(cyl(r * 0.78, h, 8), i ? C.vermilion : C.plaster, 0, y - 1.5 - h / 2, 0, { ry: Math.PI / 8 });
    for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2 + Math.PI / 8; add(new THREE.ConeGeometry(0.35, 1.4, 5), C.gold, Math.cos(a) * (r + 2.6), y - 0.6, Math.sin(a) * (r + 2.6), { rz: Math.PI / 2.3 * Math.sign(Math.cos(a)), metal: 1 }); }
    y -= h + 1.4;
  }
  add(new THREE.ConeGeometry(2.4, 6, 8), C.gold, 0, y - 2, 0, { rx: Math.PI, metal: 1 });
  add(cyl(R + 0.4, 1.0, 8), C.gold, 0, AH - 0.5, 0, { ry: Math.PI / 8, metal: 1 });
  add(cyl(R - 0.2, 1.05, 8), C.whiteJade, 0, AH - 0.45, 0, { ry: Math.PI / 8 });
  add(cyl(R - 3, 1.07, 8), C.jadePale, 0, AH - 0.44, 0, { ry: Math.PI / 8 });
  add(cyl(R - 3.6, 1.09, 8), C.whiteJade, 0, AH - 0.43, 0, { ry: Math.PI / 8 });
  add(cyl(2.2, 1.11, 8), C.gold, 0, AH - 0.42, 0, { ry: Math.PI / 8, metal: 1 });
  for (let k = 0; k < 8; k++) {
    const a = k / 8 * Math.PI * 2 + Math.PI / 8, r = R - 0.2;
    add(cyl(0.35, 1.4, 8), C.gold, Math.cos(a) * r, AH + 0.7, Math.sin(a) * r, { metal: 1 });
    add(new THREE.SphereGeometry(0.55, 10, 8), 0xFFE2A0, Math.cos(a) * r, AH + 1.7, Math.sin(a) * r, { glow: 1.0, smooth: 1 });
  }
  // two hanging bells under the lowest eave
  for (const s of [-1, 1]) add(cyl(0.5, 1.1, 10, 0.8), C.gold, s * (R * 0.48 + 2), AH - 15.5, 0, { metal: 1 });
}

// ---------- two cultivators for scale ----------
function avatar(x, z, face, robe, sash, pose = 0) {
  const g = new THREE.Group(); g.position.set(x, AH + (ARENA === "B" ? 0.2 : 0), z); g.rotation.y = face; scene.add(g);
  add(box(0.9, 2, 0.9), 0x2B2433, -0.5, 1, 0, { parent: g }); add(box(0.9, 2, 0.9), 0x2B2433, 0.5, 1, 0, { parent: g });
  add(box(2.1, 2.3, 1.1), robe, 0, 3.1, 0, { parent: g });
  add(box(2.2, 0.35, 1.2), sash, 0, 2.6, 0, { parent: g });
  add(box(1.3, 1.3, 1.3), 0xF2D2B6, 0, 4.95, 0, { parent: g });
  add(box(1.4, 0.5, 1.4), 0x2B2024, 0, 5.6, 0.05, { parent: g });
  add(box(0.8, 2.1, 0.8), robe, -1.45, 3.1, pose ? -0.6 : 0, { parent: g, rx: pose ? -1.4 : 0 });
  add(box(0.8, 2.1, 0.8), robe, 1.45, 3.1, 0, { parent: g });
  return g;
}

let cam;
if (VIEW === "hero") {
  avatar(-2.5, 2.5, 0.5, 0xEDE3CF, C.jade, 1);
  avatar(1.5, -1.5, 0.5 + Math.PI, 0x5B7FD6, C.gold);
  cam = new THREE.PerspectiveCamera(50, W / H, 0.5, 2000);
  cam.position.set(24, AH + 13, 40);
  cam.lookAt(0, AH - 7, 0);
} else {
  // over the shoulder on the altar, a rival in front, the drop behind them
  avatar(0, 5, Math.PI, 0xEDE3CF, C.jade, 1);
  avatar(1.5, -2.5, 0.2, 0x5B7FD6, C.gold);
  avatar(-6, -4, 1.0, 0xC25A7C, C.whiteJade);
  cam = new THREE.PerspectiveCamera(70, W / H, 0.5, 2000);
  cam.position.set(2, AH + 9, 17);
  cam.lookAt(-0.5, AH + 1, -6);
}
renderer.render(scene, cam);

// ---------- phone HUD (749 x 381, layout of the game's HUD pick B) ----------
const ic = (k, s) => newIcon(k, "A").replace("<svg ", `<svg width="${s}" height="${s}" `);
let h = "";
const label = { A: "A: Jade Lotus, round, petals hang out and down from the rim", B: "B: Lei Tai, the square duel stage, banners on the 4 corner posts only", C: "C: Sky Pagoda, an inverted pagoda floating point down, the fight on its top floor" }[ARENA];
if (VIEW === "hero") {
  h += `<div class="lbl">${label} · 28 studs up (was 15), 11 radius (was 9)</div>`;
} else {
  // Roblox chrome: top-left buttons, thumbstick, jump (small screen: 70 px at right -95, bottom -90)
  h += `<div class="abs" style="left:8px;top:6px;width:34px;height:34px;border-radius:9px;background:rgba(0,0,0,.45)"></div><div class="abs" style="left:48px;top:6px;width:34px;height:34px;border-radius:9px;background:rgba(0,0,0,.45)"></div>`;
  h += `<div class="ring" style="left:34px;top:${H - 150}px;width:104px;height:104px"></div><div class="ring" style="left:66px;top:${H - 118}px;width:40px;height:40px;background:rgba(255,255,255,.25)"></div>`;
  const jx = W - 95, jy = H - 90;
  h += `<div class="ring" style="left:${jx}px;top:${jy}px;width:70px;height:70px"><svg viewBox="0 0 70 70" width="70" height="70"><path d="M35 22 L48 38 H40 V48 H30 V38 H22 Z" fill="rgba(255,255,255,.7)"/></svg></div>`;
  // qi counter
  h += `<div class="abs" style="left:50%;top:4px;transform:translateX(-50%);display:flex;align-items:center;gap:4px">${ic("qi", 30)}<span class="big" style="font-size:26px">6.12M</span></div>`;
  // left rail: Shop / Disciples / Karma
  [["shop", "Shop", "#F2C14E"], ["disciple", "3/5", "#3A3346"], ["karma", "Karma", "#3A3346"]].forEach(([k, t, bg], i) => {
    h += `<div class="sq" style="left:10px;top:${48 + i * 62}px;width:42px;height:42px;background:${bg}">${ic(k, 30)}</div><span class="big abs" style="left:31px;top:${93 + i * 62}px;transform:translateX(-50%);font-size:11px">${t}</span>`;
  });
  // right stack: gift, pill, altar row (beads), sword
  const rx = W - 54;
  h += `<div class="sq" style="left:${rx}px;top:46px;width:40px;height:40px">${ic("gift", 28)}</div><span class="big abs" style="left:${rx + 20}px;top:88px;transform:translateX(-50%);font-size:11px">4:15</span>`;
  h += `<div class="sq" style="left:${rx}px;top:104px;width:40px;height:40px">${ic("pill", 28)}</div><span class="big abs" style="left:${rx + 20}px;top:146px;transform:translateX(-50%);font-size:11px">1:42</span>`;
  let beads = ""; for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2; beads += `<circle cx="${30 + Math.cos(a) * 26}" cy="${30 + Math.sin(a) * 26}" r="3.6" fill="${i < 6 ? "#FFD34D" : "#3A2C44"}" stroke="#1B1420" stroke-width="1.5"/>`; }
  h += `<svg class="abs" style="left:${rx - 10}px;top:156px" width="60" height="60" viewBox="0 0 60 60">${beads}</svg><div class="tb" style="left:${rx}px;top:166px;width:40px;height:40px;background:#D9473B">${ic("altar", 28)}</div><span class="big abs" style="left:${rx + 20}px;top:220px;transform:translateX(-50%);font-size:11px;color:#FFE36B">8s</span>`;
  h += `<div class="sq" style="left:${rx}px;top:236px;width:40px;height:40px">${ic("swordJade", 28)}</div><span class="big abs" style="left:${rx + 20}px;top:278px;transform:translateX(-50%);font-size:11px">Fly</span>`;
  // realm bar (bottom centre)
  h += `<div class="abs" style="left:50%;top:${H - 40}px;transform:translateX(-50%);width:190px;height:16px;border-radius:9px;background:#2B2433;border:2px solid var(--ink)"><div style="width:22%;height:100%;border-radius:9px;background:#6FE0B4"></div></div><span class="big abs" style="left:50%;top:${H - 58}px;transform:translateX(-50%);font-size:12px">Qi Condensation</span>`;
  // the Palm Strike button
  function palm(x, y, s, cool) {
    let t = `<div class="tb" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:#FF9F43;overflow:hidden">${ic("palm", Math.round(s * 0.66))}`;
    if (cool) t += `<div class="abs" style="left:0;right:0;bottom:0;height:${cool * 100}%;background:rgba(27,20,32,.5)"></div>`;
    t += `</div><span class="big abs" style="left:${x + s / 2}px;top:${y + s + 5}px;transform:translateX(-50%);font-size:12px">Palm</span>`;
    return t;
  }
  if (BTN === "1") {
    // the Recruit seal steps aside while you stand on the altar; Palm takes its spot left of Jump
    h += palm(jx - 12 - 78, jy - 6, 78, 0);
    h += `<div class="lbl top">Button 1: on the altar Palm takes the Recruit seal's spot, left of Jump (Recruit comes back when you leave)</div>`;
  } else {
    // Palm on the thumb arc up-left of Jump; the Recruit seal stays
    const rs = 74;
    h += `<div class="tb" style="left:${jx - 12 - rs}px;top:${jy + 70 - rs}px;width:${rs}px;height:${rs}px;background:#9B6BE8">${ic("disciple", 40)}</div><span class="big abs" style="left:${jx - 12 - rs / 2}px;top:${jy + 74}px;transform:translateX(-50%);font-size:12px">Recruit</span>`;
    h += palm(jx - 60, jy - 82, 62, 0.4);
    h += `<div class="lbl top">Button 2: Palm on the thumb arc, up-left of Jump; the Recruit seal stays (shown cooling down)</div>`;
  }
}
document.getElementById("hud").innerHTML = h;
document.title = "ready";
</script></body></html>
