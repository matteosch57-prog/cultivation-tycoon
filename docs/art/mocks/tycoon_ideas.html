<!doctype html>
<html><head><meta charset="utf-8"><title>Tycoon idea mocks</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Fredoka,sans-serif;background:#241c2b;color:#fff;padding:16px}
h1{font-size:20px;margin-bottom:4px}p.n{font:500 13px sans-serif;color:#cbbfd6;margin-bottom:14px;max-width:900px}
.row{display:flex;flex-wrap:wrap;gap:18px}
.opt{width:min(100%,520px)}
.opt h2{font-size:16px;margin:0 0 6px}.opt p{font:500 12px sans-serif;color:#cbbfd6;margin-top:6px}
.scene{position:relative;width:100%;aspect-ratio:667/375;border-radius:14px;overflow:hidden;
 background:linear-gradient(#8fb8f0 0%,#f3c9a8 55%,#e9eef7 56%,#cfd9ee 100%)}
.island{position:absolute;left:22%;right:22%;top:52%;height:22%;border-radius:50%;background:#6fae5c;box-shadow:0 10px 0 #7b5a44}
.big{color:#fff;font-weight:700;-webkit-text-stroke:3px #1b1420;paint-order:stroke fill;letter-spacing:.4px;line-height:1}
.toy{border:2px solid #1b1420;border-radius:10px;box-shadow:0 3px 0 #1b1420;position:relative;display:flex;align-items:center;justify-content:center}
.toy::after{content:"";position:absolute;left:10%;right:10%;top:12%;height:22%;border-radius:999px;background:rgba(255,255,255,.35)}
.qi{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px}
.stick{position:absolute;left:5%;bottom:7%;width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.15)}
.jump{position:absolute;right:5%;bottom:7%;width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.15)}
.side{position:absolute;left:8px;top:50%;transform:translateY(-55%);display:flex;flex-direction:column;gap:7px;align-items:center}
.tag{font:600 11px sans-serif;background:#59d39f;color:#1b1420;border-radius:6px;padding:2px 7px;display:inline-block}
</style></head><body>
<h1>Tycoon ideas: HUD mocks (phone, mock C style)</h1>
<p class="n">Two small HUD additions from the tycoon study. Each option shows the waiting state and the active state. Nothing here is built; pick one per idea (or none).</p>
<div class="row" id="row"></div>
<script>
const qiIcon=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M32 4C44 16 54 26 54 38a22 22 0 0 1-44 0C10 26 20 16 32 4z" fill="#6fd6ae" stroke="#1b1420" stroke-width="5" stroke-linejoin="round"/><path d="M32 22c7 6 11 11 11 17a11 11 0 0 1-15 10c6-2 8-8 4-13-3-4-2-9 0-14z" fill="#e8fff4"/></svg>`;
const wave=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M6 40c8-10 16-10 22 0s16 10 22 0 8-6 8-6v22H6z" fill="#9fd0ff" stroke="#1b1420" stroke-width="5" stroke-linejoin="round"/><path d="M10 26c6-8 12-8 18 0s12 8 18 0" fill="none" stroke="#1b1420" stroke-width="5" stroke-linecap="round"/></svg>`;
const gift=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><rect x="10" y="26" width="44" height="30" rx="4" fill="#e65b4f" stroke="#1b1420" stroke-width="5"/><rect x="6" y="18" width="52" height="12" rx="3" fill="#ff7a6b" stroke="#1b1420" stroke-width="5"/><path d="M32 18v38" stroke="#ffd34d" stroke-width="7"/><path d="M32 18c-10-12-18-4-10 0M32 18c10-12 18-4 10 0" fill="none" stroke="#1b1420" stroke-width="4"/></svg>`;
const counter=(rate,tide)=>`<div class="qi">${qiIcon(30)}<div style="display:flex;flex-direction:column;gap:2px">
 <span class="big" style="font-size:24px">1,774</span>
 <span class="big" style="font-size:12px;color:${tide?'#9fd0ff':'#9ff5c8'}">+${rate}/s</span></div></div>`;
const btn=(icon,label,color,extra='')=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
 <div class="toy" style="width:40px;height:40px;background:${color};${extra}">${icon(28)}</div>
 <span class="big" style="font-size:10px;-webkit-text-stroke:2.5px #1b1420">${label}</span></div>`;
const frame=(inner,cap)=>`<div style="flex:1;min-width:240px"><div class="scene"><div class="island"></div><div class="stick"></div><div class="jump"></div>${inner}</div><p>${cap}</p></div>`;
const opts=[
 {t:'Idea 3, option A: tide line under the counter',tag:'recommended',p:'One quiet line under the qi counter. When the tide runs, the rate turns blue and the line counts down. No new button.',
  a:counter(19)+`<div style="position:absolute;top:44px;left:50%;transform:translateX(-50%)"><span class="big" style="font-size:11px;color:#cfe6ff">Spirit Tide in 3:12</span></div>`,
  b:counter(38,1)+`<div style="position:absolute;top:44px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px">${wave(16)}<span class="big" style="font-size:13px;color:#9fd0ff">2x Spirit Tide 1:05</span></div>`},
 {t:'Idea 3, option B: tide button on the left column',p:'A wave toy button under Disciples and Shop with its timer. Tapping it explains the tide in one picture.',
  a:counter(19)+`<div class="side">${btn(wave,'3:12','#d8e9ff')}</div>`,
  b:counter(38,1)+`<div class="side">${btn(wave,'2x 1:05','#9fd0ff','transform:rotate(-6deg)')}</div>`},
 {t:'Idea 2, option A: playtime gift button',tag:'recommended',p:'A gift toy button with the time to the next gift (5, 15, 30 min of play). It wobbles with a red dot when ready; one tap claims qi.',
  a:counter(19)+`<div class="side">${btn(gift,'Gift 4:20','#ffb3a8')}</div>`,
  b:counter(19)+`<div class="side"><div style="position:relative">${btn(gift,'Claim!','#ffd36b','transform:rotate(6deg)')}<span class="big" style="position:absolute;top:-6px;right:-6px;background:#e33;border:2px solid #1b1420;border-radius:999px;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;-webkit-text-stroke:2px #1b1420">!</span></div></div>`},
 {t:'Idea 2, option B: gift track along the bottom',p:'Three gift boxes on a thin track above the realm bar, filling as you play. Shows all three goals at once but takes more room on a phone.',
  a:counter(19)+`<div style="position:absolute;left:50%;bottom:8%;transform:translateX(-50%);display:flex;align-items:center;gap:6px"><div style="width:150px;height:8px;border:2px solid #1b1420;border-radius:9px;background:#3a2d40;overflow:hidden"><div style="width:30%;height:100%;background:#ffb3a8"></div></div>${gift(20)}${gift(20)}${gift(20)}</div>`,
  b:counter(19)+`<div style="position:absolute;left:50%;bottom:8%;transform:translateX(-50%);display:flex;align-items:center;gap:6px"><div style="width:150px;height:8px;border:2px solid #1b1420;border-radius:9px;background:#3a2d40;overflow:hidden"><div style="width:100%;height:100%;background:#ffd36b"></div></div><span style="transform:rotate(8deg) scale(1.3)">${gift(20)}</span>${gift(20)}${gift(20)}</div>`},
];
document.getElementById('row').innerHTML=opts.map(o=>`<div class="opt" style="width:100%"><h2>${o.t} ${o.tag?`<span class="tag">${o.tag}</span>`:''}</h2>
<div class="row">${frame(o.a,'Waiting')}${frame(o.b,'Active')}</div><p>${o.p}</p></div>`).join('');
</script></body></html>
