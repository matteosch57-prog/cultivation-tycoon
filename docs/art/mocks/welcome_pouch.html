<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<!-- Welcome Pouch mocks (2026-10-22, owner: "welcome pouch, a good fixed bonus as entry door, like an
     epic disciple and a 10% Qi boost, something easy to open"). 5 Robux, once per player: an Elder
     (+150%) and +10% Qi forever. ?v=a (offer card after the first breakthrough), ?v=b (a quiet
     corner offer), ?v=tile (its Shop tile). Rendered at phone size 844 x 390. -->
<style>
*{box-sizing:border-box;margin:0}
html,body{width:844px;height:390px;overflow:hidden;font-family:Fredoka,sans-serif}
.scene{position:relative;width:844px;height:390px;background:url('../captures/26_check_full_peak.jpg') center/cover}
.veil{position:absolute;inset:0;background:rgba(20,14,30,.55)}
.big{color:#fff;font-weight:700;-webkit-text-stroke:var(--sw,4px) #1b1420;paint-order:stroke fill;white-space:nowrap}
.btn{position:relative;border-radius:var(--r,14px)}
.btn .sh{position:absolute;inset:0;transform:translateY(4px);border-radius:inherit;background:#1b1420}
.btn .face{position:absolute;inset:0;border-radius:inherit;border:3px solid #1b1420;background:var(--c);overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px}
.btn .glass{position:absolute;left:5%;right:5%;top:5%;height:46%;border-radius:calc(var(--r,14px) - 3px);background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.03))}
.btn .face>*:not(.glass){position:relative;z-index:2}
.tag{position:absolute;left:8px;top:8px;font:600 12px sans-serif;color:#fff;background:rgba(0,0,0,.6);padding:3px 10px;border-radius:6px;z-index:9}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column;align-items:center}
.elder{position:relative;width:var(--s);height:var(--s)}
.elder i{position:absolute;inset:-18%;background:url('_glow.png') center/contain no-repeat;filter:drop-shadow(0 0 0 #be64ff);opacity:.8;mix-blend-mode:normal}
.elder i.g{background:radial-gradient(circle,rgba(190,100,255,.75),rgba(190,100,255,0) 70%)}
.elder i.r{background:url('_rays12.png') center/contain no-repeat;opacity:.45;filter:sepia(1) saturate(6) hue-rotate(230deg)}
.elder b{position:absolute;inset:0;background:url('_elder_fig.png') center/contain no-repeat}
</style></head>
<body><div class="scene"><div id="m"></div><div class="tag" id="tag"></div></div>
<script>
const v=new URLSearchParams(location.search).get('v')||'a';
const qi=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M32 4C44 16 54 26 54 38a22 22 0 0 1-44 0C10 26 20 16 32 4z" fill="#6fd6ae" stroke="#1b1420" stroke-width="5" stroke-linejoin="round"/><path d="M32 22c7 6 11 11 11 17a11 11 0 0 1-15 10c6-2 8-8 4-13-3-4-2-9 0-14z" fill="#e8fff4"/></svg>`;
const robux=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><rect x="9" y="9" width="46" height="46" rx="13" fill="#fff" stroke="#1b1420" stroke-width="5"/><rect x="23" y="23" width="18" height="18" rx="3" fill="#1b1420"/></svg>`;
const pouch=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M22 14c4 4 16 4 20 0l-2 8H24z" fill="#e65b4f" stroke="#1b1420" stroke-width="4" stroke-linejoin="round"/><path d="M24 22h16c12 8 16 18 12 28-3 8-37 8-40 0-4-10 0-20 12-28z" fill="#ffd34d" stroke="#1b1420" stroke-width="5" stroke-linejoin="round"/><rect x="21" y="20" width="22" height="6" rx="3" fill="#e65b4f" stroke="#1b1420" stroke-width="3"/><g transform="translate(22 30) scale(.32)">${qi(64).replace(/<\/?svg[^>]*>/g,'')}</g><circle cx="22" cy="38" r="3" fill="#fff" opacity=".5"/></svg>`;
const elder=s=>`<div class="elder" style="--s:${s}px"><i class="g"></i><i class="r"></i><b></b></div>`;
const btn=(c,w,h,inner,r=14)=>`<div class="btn" style="width:${w}px;height:${h}px;--c:${c};--r:${r}px"><div class="sh"></div><div class="face"><div class="glass"></div>${inner}</div></div>`;
const M=document.getElementById('m'), T=document.getElementById('tag');
const contents=(s)=>`<div class="row" style="gap:${22*s}px;align-items:flex-end">
  <div class="col" style="gap:2px">${elder(86*s)}<span class="big" style="font-size:${20*s}px;color:#c98cff">Elder</span><span class="big" style="font-size:${14*s}px;--sw:3px">+150%</span></div>
  <span class="big" style="font-size:${30*s}px;color:#ffe36b;margin-bottom:${34*s}px">+</span>
  <div class="col" style="gap:2px"><div style="position:relative;width:${86*s}px;height:${86*s}px;display:flex;align-items:center;justify-content:center">${qi(60*s)}<span class="big" style="position:absolute;right:${-4*s}px;bottom:${6*s}px;font-size:${22*s}px;color:#ffe36b">10%</span></div><span class="big" style="font-size:${20*s}px;color:#9ff5c8">+10% Qi</span><span class="big" style="font-size:${14*s}px;--sw:3px">forever</span></div>
</div>`;
if(v==='a'){
  T.textContent='A: an offer card after the first breakthrough (recommended)';
  M.innerHTML=`<div class="veil"></div><div class="col" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);gap:10px">
   <div class="row" style="gap:8px">${pouch(46)}<span class="big" style="font-size:34px;color:#ffe36b;--sw:5px">Welcome Pouch</span></div>
   ${contents(1)}
   <div class="row" style="gap:14px;margin-top:6px">${btn('#59d39f',150,52,`${robux(26)}<span class="big" style="font-size:26px">5</span>`)}</div>
   <span class="big" style="font-size:14px;color:#d9d0e8;--sw:3px">Once only · Not now</span></div>`;
}
if(v==='b'){
  T.textContent='B: a quiet corner offer (the game keeps playing)';
  M.innerHTML=`<div class="col" style="position:absolute;right:130px;bottom:96px;gap:4px;transform:rotate(-2deg)">
   <div style="position:relative;padding:10px 14px 12px;border-radius:18px;background:rgba(27,20,32,.72);border:3px solid #1b1420">
    <div class="row" style="gap:6px;justify-content:center;margin-bottom:4px">${pouch(28)}<span class="big" style="font-size:20px;color:#ffe36b">Welcome Pouch</span></div>
    ${contents(0.62)}
    <div class="row" style="justify-content:center;margin-top:8px">${btn('#59d39f',96,36,`${robux(18)}<span class="big" style="font-size:18px">5</span>`,11)}</div>
   </div><span class="big" style="font-size:11px;color:#d9d0e8;--sw:2.5px">once only</span></div>`;
}
if(v==='tile'){
  T.textContent='The Shop tile (Boosts tab, first in the row until bought)';
  M.innerHTML=`<div class="veil" style="background:rgba(20,14,30,.68)"></div><div class="row" style="position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);gap:18px;align-items:flex-start">
   <div class="col" style="gap:2px;position:relative">
     <div style="position:absolute;right:-14px;top:-8px;z-index:5;transform:rotate(8deg);background:#ff6b5e;border:3px solid #1b1420;border-radius:8px;padding:1px 8px"><span class="big" style="font-size:12px;--sw:3px">Once</span></div>
     ${btn('#ffd36b',96,96,`<div style="position:relative;width:76px;height:76px">${pouch(60).replace('<svg','<svg style="position:absolute;left:0;top:4px"')}<div style="position:absolute;right:-6px;bottom:-4px">${elder(38)}</div></div>`,20)}
     <span class="big" style="font-size:17px">Welcome Pouch</span>
     <span class="big" style="font-size:12px;color:#c9ffe4;--sw:3px">Elder + 10% Qi forever</span>
     <div style="height:3px"></div>${btn('#59d39f',96,32,`${robux(17)}<span class="big" style="font-size:16px">5</span>`,10)}
   </div>
   ${['2x Qi','Auto Orbs','VIP Sect'].map(n=>`<div class="col" style="gap:2px;opacity:.55">${btn('#cfc6e0',96,96,'',20)}<span class="big" style="font-size:17px">${n}</span></div>`).join('')}
  </div>`;
}
</script></body></html>
