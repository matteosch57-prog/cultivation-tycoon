<!doctype html>
<html><head><meta charset="utf-8">
<!-- Disciple atlas generator (2026-10-21): the mock's drawings (docs/art/mocks/disciple_auras.html)
     as one 1024 x 1024 transparent image, art/ui/disciple_atlas.png. Render with a transparent
     background (Edge/Chrome headless --default-background-color=00000000 --window-size=1024,1024).
     Grid of 128 px cells; the cell of every piece is listed in Config.DISCIPLE_ATLAS (x, y, w, h).
     Pieces are drawn WHITE where the game tints them (ImageColor3): glow, rays, ring, halo, flame,
     sparkle, mote. The disciples, clouds and the yin-yang ring keep their own colours.
     ?preview=1 draws a dark backdrop and a grid to check it by eye. -->
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;overflow:hidden;background:transparent}
.cell{position:absolute}
body.preview{background:#231b33}
body.preview .cell{outline:1px dashed rgba(255,255,255,.25)}
</style></head>
<body><div id="a"></div>
<script>
if(new URLSearchParams(location.search).get('preview'))document.body.classList.add('preview');
const INK='#1b1420', SKIN='#f2cfae', GOLD='#ffd34d';
const COL=['#c8c8c8','#5ac878','#5096ff','#be64ff','#ffc83c','#6ee1eb','#e6323c','#ff8c28','#ff6edc'];
// the mock's figure (64 x 64 units, drawn into its cell)
function figure(tier){
  const col=COL[tier];
  const robe=tier===8?'url(#rb)':col;
  let b=`<ellipse cx="32" cy="55" rx="23" ry="7" fill="${robe}" stroke="${INK}" stroke-width="3.5"/>
   <path d="M15 54c0-14 7-20 17-20s17 6 17 20z" fill="${robe}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
   <path d="M32 34l-5 12h10z" fill="#fff"/><ellipse cx="32" cy="50" rx="7" ry="4" fill="${SKIN}" stroke="${INK}" stroke-width="2.5"/>`;
  if(tier>=2) b+=`<path d="M17 47c8 3 22 3 30 0" fill="none" stroke="${tier>=4?'#ffe36b':'#fff'}" stroke-width="3"/>`;
  let h=`<circle cx="32" cy="10" r="5.5" fill="${INK}"/><circle cx="32" cy="23" r="11" fill="${SKIN}" stroke="${INK}" stroke-width="3.5"/>
   <path d="M21 21c2-8 20-8 22 0-5-3-17-3-22 0z" fill="${INK}"/><path d="M27 25q2 2 4 0M33 25q2 2 4 0" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>`;
  if(tier===1) h+=`<rect x="36" y="6" width="9" height="3" rx="1.5" fill="#5ac878" stroke="${INK}" stroke-width="1.5"/>`;
  if(tier===3) h+=`<path d="M26 8l3-5 3 4 3-4 3 5z" fill="#d9b8ff" stroke="${INK}" stroke-width="1.8"/>`;
  if(tier===7) h+=`<path d="M22 9l3-7 4 5 3-6 3 6 4-5 3 7z" fill="${GOLD}" stroke="${INK}" stroke-width="2"/>`;
  return `<svg viewBox="-4 -6 72 72" width="100%" height="100%"><defs><linearGradient id="rb" x1="0" x2="1"><stop offset="0" stop-color="#ff6e6e"/><stop offset=".25" stop-color="#ffd34d"/><stop offset=".5" stop-color="#6ee1a0"/><stop offset=".75" stop-color="#6eaaff"/><stop offset="1" stop-color="#d06eff"/></linearGradient></defs>${b}${h}</svg>`;
}
// white pieces (tinted in game)
const P={
 glow:`<svg viewBox="0 0 100 100" width="100%" height="100%"><defs><radialGradient id="g"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="50" r="50" fill="url(#g)"/></svg>`,
 rays12:rays(12,14), rays8:rays(8,9),
 ring:`<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="2.6" stroke-dasharray="11 7.5"/></svg>`,
 yinyang:`<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="44" fill="none" stroke="${INK}" stroke-width="7"/><path d="M50 6a44 44 0 0 1 0 88" fill="none" stroke="#fff" stroke-width="7"/><circle cx="50" cy="6" r="5.5" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="50" cy="94" r="5.5" fill="${INK}" stroke="#fff" stroke-width="2"/></svg>`,
 halo:`<svg viewBox="0 0 100 40" width="100%" height="100%"><ellipse cx="50" cy="20" rx="44" ry="13" fill="none" stroke="#fff" stroke-width="10" opacity=".45"/><ellipse cx="50" cy="20" rx="42" ry="12" fill="none" stroke="#fff" stroke-width="6"/></svg>`,
 cloud:`<svg viewBox="0 0 64 40" width="100%" height="100%"><g stroke="${INK}" stroke-width="3"><circle cx="18" cy="24" r="12" fill="#f2ffff"/><circle cx="34" cy="17" r="15" fill="#f2ffff"/><circle cx="49" cy="25" r="10" fill="#f2ffff"/></g><rect x="16" y="22" width="34" height="12" fill="#f2ffff"/></svg>`,
 flame:`<svg viewBox="0 0 40 64" width="100%" height="100%"><defs><linearGradient id="f" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient></defs><path d="M6 60 Q2 34 20 4 Q38 34 34 60z" fill="url(#f)"/></svg>`,
 sparkle:`<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M20 0L24 16L40 20L24 24L20 40L16 24L0 20L16 16z" fill="#fff"/></svg>`,
 mote:`<svg viewBox="0 0 40 40" width="100%" height="100%"><defs><radialGradient id="m"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><circle cx="20" cy="20" r="20" fill="url(#m)"/></svg>`,
};
function rays(n,w){let s='';for(let i=0;i<n;i++)s+=`<g transform="rotate(${i*360/n} 50 50)"><path d="M${50-w/2} 50 L${50-w*0.12} 2 L${50+w*0.12} 2 L${50+w/2} 50z" fill="url(#r)"/></g>`;
 return `<svg viewBox="0 0 100 100" width="100%" height="100%"><defs><linearGradient id="r" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>${s}</svg>`;}
// layout in px: [name, x, y, w, h]
const L=[['glow',0,0,256,256],['rays12',256,0,256,256],['rays8',512,0,256,256],['ring',768,0,256,256],
 ['yinyang',0,256,256,256],['halo',256,256,256,104],['cloud',256,384,128,80],['flame',384,384,80,128],['sparkle',512,256,64,64],['mote',576,256,64,64]];
for(let i=0;i<9;i++)L.push(['fig'+(i+1),(i%8)*128,512+Math.floor(i/8)*128,128,128]);
let h='';
for(const [n,x,y,w,hh] of L){
  // each piece gets unique gradient ids
  let svg=n.startsWith('fig')?figure(+n.slice(3)-1):P[n];
  svg=svg.replace(/id="(\w+)"/g,`id="$1_${n}"`).replace(/url\(#(\w+)\)/g,`url(#$1_${n})`);
  h+=`<div class="cell" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px">${svg}</div>`;
}
document.getElementById('a').innerHTML=h;
window.LAYOUT=L;
</script></body></html>
